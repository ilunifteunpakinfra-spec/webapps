# ============================================
# ILUNI FT ELEKTRO UNPAK — User Manual
# Deploy VitePress site + generate PDF ke GitHub Pages
# ============================================
# Trigger:
#   - push ke branch `docs` (perubahan pada docs/ atau workflow)
#   - manual via workflow_dispatch
# Output:
#   - Situs VitePress di-publish ke branch `gh-pages` (GitHub Pages)
#     URL: https://ilunifteunpakinfra-spec.github.io/webapps/
#   - PDF per halaman + manual-latest.pdf di docs/public/pdfs/
#     (di-commit kembali ke branch docs dengan penanda [skip ci]
#      agar tidak memicu workflow berulang)
# ============================================
name: Deploy Docs (VitePress + PDF)

on:
  push:
    branches: [docs]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies (docs)
        working-directory: docs
        run: npm ci

      - name: Install Chromium for PDF generation
        working-directory: docs
        run: npx playwright install --with-deps chromium

      - name: Build VitePress site
        working-directory: docs
        run: npm run build

      - name: Generate PDFs
        working-directory: docs
        run: node scripts/generate-pdfs.mjs

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/public/pdfs/*.pdf
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan PDF."
          else
            git commit -m "docs(ci): update generated PDF files [skip ci]"
            git push origin docs
          fi

      - name: Deploy to GitHub Pages (branch gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
